<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PDF MB</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="workspace">
    <aside id="pages-panel" aria-label="Gestione pagine" hidden>
      <div class="panel-heading"><h2>Gestisci pagine</h2><button id="panel-close" class="secondary" aria-label="Chiudi pannello pagine">×</button></div>
      <p id="edit-reason" class="notice" role="status" hidden></p>
      <p id="selection-count" role="status">0 pagine selezionate</p>
      <small class="selection-help">Tasto destro: comandi · Ctrl/Maiusc+clic: selezione</small>
      <div id="page-list" role="listbox" aria-label="Pagine del documento" aria-multiselectable="true"></div>
    </aside>
    <main id="viewer" aria-label="Visualizzatore PDF"></main>
  </div>
  <div id="page-menu" popover="auto" role="menu" aria-labelledby="page-menu-title" tabindex="-1">
    <div id="page-menu-title" class="page-menu-title"></div>
    <button type="button" role="menuitem" data-operation="rotate-left">Ruota a sinistra</button>
    <button type="button" role="menuitem" data-operation="rotate-right">Ruota a destra</button>
    <button type="button" role="menuitem" data-operation="delete" class="delete-page">Elimina</button>
    <button type="button" role="menuitem" data-operation="move">Sposta…</button>
    <hr role="separator">
    <button type="button" role="menuitem" data-operation="insert">Inserisci…</button>
  </div>
  <section id="welcome" aria-labelledby="welcome-title">
    <div class="file-icon" aria-hidden="true">PDF</div>
    <p class="eyebrow">PDF MB · DOCUMENTI</p>
    <h1 id="welcome-title">Il tuo documento, qui.</h1>
    <p>Apri un PDF per consultare pagine, miniature e testo.</p>
    <button id="open" disabled>Apri documento</button>
    <small id="hint" role="status">Avvio del motore PDF…</small>
  </section>
  <div id="fatal" role="alert" hidden><span id="error-text"></span><button id="dismiss-error" class="secondary" aria-label="Chiudi messaggio">×</button></div>
  <dialog id="move-dialog" aria-labelledby="move-title" aria-describedby="move-description">
    <h2 id="move-title">Sposta pagine</h2>
    <p id="move-description"></p>
    <label for="move-position">Posizione finale</label>
    <input id="move-position" type="number" min="1" step="1" required>
    <div class="dialog-actions"><button data-cancel-dialog class="secondary">Annulla</button><button id="move-confirm">Sposta</button></div>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <h2 id="delete-title">Elimina pagine</h2>
    <p id="delete-description"></p>
    <div class="dialog-actions"><button id="delete-cancel" data-cancel-dialog class="secondary">Annulla</button><button id="delete-confirm" class="danger">Elimina</button></div>
  </dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
